<!DOCTYPE html>
<html>
    <head>
        <title>Inventory Management System</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="sign_up_container">
            <img class="image_class" src="Photos/Logo3.png" alt="Logo">
            <h2>Create Your Account</h2>
    
            <form action="http://127.0.0.1:8000/signup" method="post">
            <input type="text" placeholder="Enter username" required>
            <input type="text" placeholder="Enter Employee Code" required>
            <input type="email" placeholder="Enter Email Address" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required><br>
            <button type="submit">Sign Up</button>
            </form>
            <p>If you already have an account?<a href="">Login</a></p>
            

        </div>
    </body>
</html>
